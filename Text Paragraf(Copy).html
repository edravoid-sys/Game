<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Interstellar Vault — Info</title>

<style>

/* =========================================================
   INTERSTELLAR VAULT — TEXT PARAGRAPH
   ========================================================= */

:root {
    --bg: #07070a;
    --panel: #101016;
    --panel-soft: #15151b;
    --line: #30303a;

    --text: #eeeeF2;
    --muted: #8d8d99;

    --accent: #ff4fb3;
    --accent-soft: rgba(255, 79, 179, 0.12);
    --accent-line: rgba(255, 79, 179, 0.35);

    --success: #9ee6c1;
    --warning: #e8d39a;
}


/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background: var(--bg);
    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    line-height: 1.7;
}


/* =========================================================
   CLOSE BUTTON
   ========================================================= */

.close-button {

    position: fixed;

    top: 18px;
    right: 18px;

    width: 44px;
    height: 44px;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 9999;

    border:
        1px solid
        var(--line);

    border-radius: 50%;

    background:
        rgba(
            16,
            16,
            22,
            0.92
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 28px;

    font-weight: 300;

    line-height: 1;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

    transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
}


/* Touch / hover */

.close-button:hover {

    background:
        var(--panel-soft);

    border-color:
        var(--accent-line);

}

.close-button:active {

    transform:
        scale(0.90);

}


/* =========================================================
   APP
   ========================================================= */

.app {

    width: 100%;

    max-width: 720px;

    margin: 0 auto;

    padding:
        22px
        18px
        35px;

}


/* =========================================================
   HEADER
   ========================================================= */

header {

    padding:
        5px
        0
        20px;

    padding-right:
        55px;

    border-bottom:
        1px solid
        var(--line);

}

.header-title {

    margin: 0;

    font-size:
        clamp(
            24px,
            7vw,
            34px
        );

    font-weight: 800;

    letter-spacing:
        0.5px;

    color:
        var(--text);

}

.header-subtitle {

    margin-top: 6px;

    color:
        var(--muted);

    font-size: 12px;

    letter-spacing:
        0.4px;

}


/* =========================================================
   SECTION TITLE
   ========================================================= */

.section-title {

    margin:
        30px
        0
        24px;

    padding-right:
        45px;

    font-size:
        clamp(
            25px,
            7vw,
            34px
        );

    line-height:
        1.25;

    font-weight:
        800;

    color:
        var(--text);

}

.section-title::before {

    content:
        "— ";

    color:
        var(--accent);

}


/* =========================================================
   CONTENT
   ========================================================= */

.content p {

    margin:
        0
        0
        20px;

    font-size:
        15px;

    color:
        var(--text);

}

.content strong {

    font-weight:
        700;

    color:
        var(--text);

}


/* =========================================================
   SMALL HEADING
   ========================================================= */

.subheading {

    margin:
        28px
        0
        12px;

    font-size:
        17px;

    font-weight:
        800;

    color:
        var(--text);

}


/* =========================================================
   EXAMPLE LABEL
   ========================================================= */

.example-label {

    margin:
        25px
        0
        9px;

    color:
        var(--muted);

    font-size:
        12px;

    font-weight:
        700;

    letter-spacing:
        0.8px;

    text-transform:
        uppercase;

}


/* =========================================================
   EXAMPLE CARD
   ========================================================= */

.example-card {

    margin:
        10px
        0
        24px;

    padding:
        18px
        18px;

    background:
        var(--panel);

    border:
        1px solid
        var(--line);

    border-radius:
        13px;

    font-family:
        "Courier New",
        Courier,
        monospace;

    overflow-x:
        auto;

}

.example-row {

    display:
        flex;

    flex-direction:
        column;

    gap:
        4px;

}

.example-input {

    color:
        var(--text);

    font-size:
        15px;

}

.example-arrow {

    color:
        var(--accent);

    font-size:
        15px;

}

.example-output {

    color:
        var(--accent);

    font-size:
        15px;

    word-break:
        break-all;

}


/* =========================================================
   CODE CARD
   ========================================================= */

.code-card {

    margin:
        12px
        0
        24px;

    padding:
        16px
        18px;

    background:
        var(--panel);

    border:
        1px solid
        var(--line);

    border-radius:
        12px;

    overflow-x:
        auto;

}

.code-card code {

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:
        13px;

    line-height:
        1.8;

    color:
        var(--text);

    white-space:
        pre;

}


/* =========================================================
   NOTE CARD
   ========================================================= */

.note-card {

    margin:
        25px
        0;

    padding:
        16px
        18px;

    background:
        var(--accent-soft);

    border-left:
        3px solid
        var(--accent);

    border-radius:
        7px;

}

.note-title {

    margin-bottom:
        6px;

    color:
        var(--accent);

    font-size:
        12px;

    font-weight:
        800;

    letter-spacing:
        0.7px;

    text-transform:
        uppercase;

}

.note-card p {

    margin:
        0;

    font-size:
        13px;

    color:
        var(--text);

}


/* =========================================================
   INFO CARD
   ========================================================= */

.info-card {

    margin:
        20px
        0;

    padding:
        17px
        18px;

    background:
        var(--panel);

    border:
        1px solid
        var(--line);

    border-radius:
        12px;

}

.info-title {

    margin-bottom:
        10px;

    color:
        var(--text);

    font-weight:
        800;

    font-size:
        14px;

}


/* =========================================================
   PREFIX TABLE
   ========================================================= */

.prefix-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        0;

    margin:
        15px
        0
        25px;

    border:
        1px solid
        var(--line);

    border-radius:
        12px;

    overflow:
        hidden;

    background:
        var(--panel);

}

.prefix-row {

    display:
        grid;

    grid-template-columns:
        75px
        1fr;

    padding:
        11px
        14px;

    border-bottom:
        1px solid
        var(--line);

    font-size:
        13px;

}

.prefix-row:last-child {

    border-bottom:
        none;

}

.prefix-code {

    font-family:
        "Courier New",
        Courier,
        monospace;

    color:
        var(--accent);

    font-weight:
        700;

}

.prefix-name {

    color:
        var(--text);

}


/* =========================================================
   CHARACTER LIST
   ========================================================= */

.character-list {

    margin:
        15px
        0
        25px;

    padding:
        15px
        18px;

    background:
        var(--panel);

    border:
        1px solid
        var(--line);

    border-radius:
        12px;

}

.character-list div {

    padding:
        8px
        0;

    border-bottom:
        1px solid
        rgba(
            255,
            255,
            255,
            0.06
        );

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size:
        13px;

}

.character-list div:last-child {

    border-bottom:
        none;

}


/* =========================================================
   HIGHLIGHT
   ========================================================= */

.highlight {

    color:
        var(--accent);

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-weight:
        700;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    margin-top:
        45px;

    padding-top:
        18px;

    border-top:
        1px solid
        var(--line);

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        11px;

    line-height:
        1.6;

}

.footer-main {

    color:
        var(--text);

    margin-bottom:
        3px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 500px) {

    .app {

        padding:
            18px
            15px
            30px;

    }

    .content p {

        font-size:
            14.5px;

    }

    .example-card {

        padding:
            15px;

    }

    .prefix-row {

        grid-template-columns:
            65px
            1fr;

        font-size:
            12px;

    }

    .close-button {

        top:
            14px;

        right:
            14px;

        width:
            42px;

        height:
            42px;

        font-size:
            27px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior:
            auto;
    }

    .close-button {
        transition:
            none;
    }

}

</style>

</head>
